<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Мой сайт</title>

		<style>
			body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 30px;

			/* Разноцветный фон */
			background: linear-gradient(
			135deg,
			#ff9a9e,
			#fad0c4,
			#a1c4fd,
			#c2e9fb,
			#d4fc79
			);

			min-height: 100vh;
			}

			.container {
			max-width: 900px;
			margin: auto;
			background: white;
			padding: 30px;
			border-radius: 15px;
			}

			h1 {
			text-align: center;
			}

			.question {
			text-align: center;
			font-size: 22px;
			}

			.image-place {
			text-align: center;
			margin: 20px 0;
			}

			.image-place img {
			max-width: 100%;
			height: auto;
			}

			.thanks {
			text-align: center;
			font-size: 24px;
			font-weight: bold;
			}
		</style>
	</head>

	<body>

		<div class="container">

			<h1>СПАСИБО ЗА ВНИМАНИЕ!</h1>

			<div class="image-place">
				<img
					src="https://donballon37.ru/wa-data/public/shop/products/29/42/24229/images/8169/8169.970.jpg"
					alt="Описание картинки"
            />
			</div>

			<p class="thanks">СПАСИБО ЗА ВНИМАНИЕ!</p>

		</div>

	</body>

</html>
