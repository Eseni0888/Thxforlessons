<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Мой сайт</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;

            background: linear-gradient(
                135deg,
                #ff9a9e,
                #fad0c4,
                #a1c4fd,
                #c2e9fb,
                #d4fc79
            );

            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px #555;
        }

        .question {
            text-align: center;
            font-size: 22px;
            color: white;
            text-shadow: 2px 2px 4px #555;
        }

        .image-place {
            text-align: center;
            margin: 30px 0;
        }

        .image-place img {
            max-width: 100%;
            height: auto;
        }

        .thanks {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px #555;
        }
    </style>
</head>

<body>

    <h1>СПАСИБО ЗА ВНИМАНИЕ!</h1>

    <p class="question">Понравился урок?</p>

    <div class="image-place">
        <img
            src="https://donballon37.ru/wa-data/public/shop/products/29/42/24229/images/8169/8169.970.jpg"
            alt="Описание картинки"
        />
    </div>

    <p class="thanks">СПАСИБО ЗА ВНИМАНИЕ!</p>

</body>

</html>
